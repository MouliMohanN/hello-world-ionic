
import java.security.MessageDigest
import java.util.zip.ZipFile

apply plugin: 'com.android.application'

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

android {
    namespace "com.example.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.example.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
      debug {
        // Debug variant configuration
        debuggable true
        minifyEnabled false
        proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      }

        release {
          minifyEnabled enableProguardInReleaseBuilds
          shrinkResources enableProguardInReleaseBuilds
          crunchPngs false // change to true to optimize pngs
          proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    bundle {
        language {
            enableSplit = true
        }
    }
}


// Helper function to calculate a file's hash
def getBuildDirectory() {
  return layout.buildDirectory.get().asFile
}

def getManifestFileFromApkPath(String apkPath, File outputDir) {
  def manifestFile = new File(outputDir, "AndroidManifest.xml")
  def apkFile = file(apkPath)

  if (!apkFile.exists()) {
    println("APK not found at: ${apkPath}")
    return
  }

  println("APK found at: ${apkPath}")

  // Extract the binary AndroidManifest.xml from the APK
  ant.unzip(src: apkPath, dest: outputDir) {
    patternset {
      include(name: "AndroidManifest.xml")
    }
  }
  return manifestFile
}

def getGeneratedManifestHash(File manifestFile) {
  if (manifestFile.exists()) {
    // Compute the hash of the binary file
    def digest = MessageDigest.getInstance("SHA-256")
    manifestFile.withInputStream { input ->
      byte[] buffer = new byte[8192]
      int bytesRead
      while ((bytesRead = input.read(buffer)) != -1) {
        digest.update(buffer, 0, bytesRead)
      }
    }
    def manifestHash = digest.digest().collect { String.format("%02x", it) }.join("")
    println("Binary AndroidManifest.xml Hash: ${manifestHash}")
    return manifestHash
  } else {
    println("Binary AndroidManifest.xml not found at path: ${manifestFile.path}")
  }
}

def saveManifestHashToFile(List<String> manifestHashes, File outputDir) {
  def outputFile = new File(outputDir, "manifest_hashes.txt")
  outputFile.write(manifestHashes.join("\n"))
  println("Manifest hashes saved to: ${outputFile.path}")
}

def getManifestHashOutputDir() {
  def outputDir = file("${getBuildDirectory()}/outputs/extracted_manifest")
  outputDir.mkdirs()
  return outputDir
}

def computeManifestHashForAllApksInDirectory(File apksDir) {
  def manifestHashes = [] as ArrayList<String>
  def outputDir = getManifestHashOutputDir()

  apksDir.eachFile { apkFile ->
    if (apkFile.name.startsWith("base-master")) {
      def apkPath = apkFile.path
      def manifestFile = getManifestFileFromApkPath(apkPath, outputDir)
      if (manifestFile != null && manifestFile.exists()) {
        def manifestHash = getGeneratedManifestHash(manifestFile)
        if (!manifestHashes.contains(manifestHash)) {
          manifestHashes.add(manifestHash)
        }
        manifestFile.delete() // Delete the manifest file after processing
      }
    }
  }
  saveManifestHashToFile(manifestHashes, outputDir)
}

// Dynamically create tasks for each variant
android.applicationVariants.all { variant ->
  def variantName = variant.name // e.g., debug, release

  task "hashManifestApk${variantName.capitalize()}" {
    group = "verification" // Optional: Group in Gradle task list
    description = "Compute hash for AndroidManifest.xml for ${variantName} variant"

    doLast {
//      def apkPath = "${getBuildDirectory()}/outputs/apk/${variantName}/app-${variantName}.apk" // Replace with your APK path
      def manifestHashes = [] as ArrayList<String>
      def outputDir = getManifestHashOutputDir()

      def manifestFile = getManifestFileFromApkPath(apkPath, outputDir)
      if (manifestFile != null && manifestFile.exists()) {
        def manifestHash = getGeneratedManifestHash(manifestFile)
        if (!manifestHashes.contains(manifestHash)) {
          manifestHashes.add(manifestHash)
        }
        manifestFile.delete() // Delete the manifest file after processing
      }
      saveManifestHashToFile(manifestHashes, outputDir)
    }
  }

  // Optionally, run this task after the variant is assembled
  tasks["assemble${variantName.capitalize()}"].finalizedBy("hashManifestApk${variantName.capitalize()}")
}

tasks.configureEach { task ->
  if (task.name == "bundleDebug") {
    task.finalizedBy("hashManifestBundleDebug")
  }
  if (task.name == "bundleRelease") {
    task.finalizedBy("hashManifestBundleRelease")
  }
}

